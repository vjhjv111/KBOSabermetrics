name: Defense validation
on:
  push:
    branches: ['feature/fanzai-defense-v1']
  pull_request:
    paths: ['PC/**', 'WEB/**', 'tests/DefenseValidation/**', '.github/workflows/defense-validation.yml']
permissions:
  contents: read
concurrency:
  group: defense-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build PC
        working-directory: PC
        run: dotnet build src/NaverRelay.Gui/NaverRelay.Gui.csproj -c Release -p:EnableWindowsTargeting=true
      - name: Build web calculation library
        working-directory: WEB
        run: dotnet build server/src/NaverRelay.Infrastructure.Sqlite/NaverRelay.Infrastructure.Sqlite.csproj -c Release
      - name: Export matching .NET 8 runtime for offline tests
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/fanzai-defense-v1' }}
        shell: bash
        run: |
          set -euo pipefail
          root=$(dirname "$(readlink -f "$(command -v dotnet)")")
          mkdir -p /tmp/defense-runtime
          python3 - "$root" <<'PY'
          import pathlib,sys,tarfile
          root=pathlib.Path(sys.argv[1])
          with tarfile.open('/tmp/defense-runtime/runtime.tgz','w:gz') as tar:
              for sub in ['host/fxr','shared/Microsoft.NETCore.App','shared/Microsoft.AspNetCore.App','packs/Microsoft.NETCore.App.Ref','packs/Microsoft.AspNetCore.App.Ref','packs/Microsoft.NETCore.App.Host.linux-x64','packs/Microsoft.WindowsDesktop.App.Ref']:
                  choices=sorted((root/sub).glob('8.*'),key=lambda p:tuple(map(int,p.name.split('.'))))
                  if choices: tar.add(choices[-1],arcname=str(choices[-1].relative_to(root)))
          PY
      - uses: actions/upload-artifact@v4.6.2
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/fanzai-defense-v1' }}
        with:
          name: defense-offline-runtime
          path: /tmp/defense-runtime/*
          retention-days: 1
          if-no-files-found: error
      - name: Run defensive reconstruction and metric tests
        if: ${{ hashFiles('tests/DefenseValidation/DefenseValidation.csproj') != '' }}
        run: dotnet run --project tests/DefenseValidation/DefenseValidation.csproj -c Release
